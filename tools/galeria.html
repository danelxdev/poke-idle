<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Galería de sprites · Dragon Ball Survivor</title>
<style>
  body { background: #2a3a5a; color: #fff; font: 12px monospace; margin: 10px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .c { background: #4f9a3a; padding: 4px; text-align: center; width: 150px; }
  .c img { image-rendering: pixelated; width: 68px; height: 100px; }
  .c .frames img { width: 34px; height: 50px; }
  h2 { margin: 14px 0 6px; }
</style>
<script src="../assets/sprites/manifest.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/data/chars.js"></script>
</head>
<body>
<div id="out"></div>
<script>
  const big = new URLSearchParams(location.search).get('big');
  const only = new URLSearchParams(location.search).get('saga');
  let html = '';
  for (const s of SAGAS) {
    if (only !== null && +only !== s.id) continue;
    html += '<h2>' + s.name + '</h2><div class="grid">';
    for (const c of CHARS.filter(x => x.saga === s.id)) {
      const sp = PX.get(c.look, null, false, c.id);
      html += '<div class="c"><img src="' + PX.dataURL(c.look, null, false, c.id) + '"><img src="' + PX.dataURL(c.look, c.forms[c.forms.length - 1], false, c.id) + '">' +
        (big ? '<div class="frames">' + sp.f.map(f => '<img src="' + f.toDataURL() + '">').join('') + '</div>' : '') + '<div>' + c.name + '</div></div>';
    }
    html += '</div>';
  }
  document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
