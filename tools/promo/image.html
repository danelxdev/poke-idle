<!doctype html>
<html lang="es"><head><meta charset="utf-8"><base href="../../">
<title>PokéIdle · imagen promocional</title>
<link rel="stylesheet" href="tools/promo/promo.css">
<style>
  #land { position: absolute; left: 0; top: 0; }
  .phone { border-radius: 64px; padding: 15px; }
  .phone .scr { border-radius: 50px; }
  .phone .notch { top: 26px; width: 112px; height: 30px; margin-left: -56px; }
  .badge { position: absolute; display: flex; align-items: center; gap: 16px; padding: 14px 26px 16px 18px; font-weight: 700; white-space: nowrap; }
  .badge img { width: calc(var(--bf, 38px) * 1.5); height: calc(var(--bf, 38px) * 1.5); }
  .badge b { display: block; font-size: var(--bf, 38px); line-height: 1; }
  .badge small { display: block; font-size: calc(var(--bf, 38px) * .66); color: var(--dim); font-weight: 400; margin-top: 6px; }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255, 210, 63, .45), transparent 65%); }
  .tagl { font-weight: 700; color: #fff; text-shadow: 0 4px 0 #1a2a6a, 0 8px 0 #050a1c; }
  .url { font-weight: 700; color: #fff; text-shadow: 0 4px 0 #1a2a6a, 0 8px 0 #050a1c; }
  .url span { color: var(--yellow); }
  .ribbon { position: absolute; font-weight: 700; color: #2a1600; background: var(--yellow); padding: 8px 22px 10px; border-radius: 12px; box-shadow: 0 6px 0 #8a5000; }
</style>
</head><body>
<div id="stage"><canvas id="land"></canvas><div id="ui" class="layer"></div><canvas id="front" style="position:absolute;left:0;top:0;z-index:4"></canvas><div id="ui2" class="layer" style="z-index:6"></div><div class="vign" style="background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(2,5,18,.55) 100%)"></div></div>
<script src="js/data/pokedex.js"></script>
<script src="js/data/forms.js"></script>
<script src="js/data/moves.js"></script>
<script src="js/data/idle.js"></script>
<script src="js/art/tiles.js"></script>
<script src="js/art/icons.js"></script>
<script src="js/data/bbox.js"></script>
<script src="js/sprites.js"></script>
<script src="tools/promo/scenery.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search), CLIPS = Q.get('clips'), F = Q.get('f') || 'ig';
const $ = s => document.querySelector(s);
// formatos: tamaño del póster y escala del paisaje (píxeles de arte → píxeles reales)
const FMT = { ig: [1080, 1350, 4], wide: [1920, 1080, 4], sq: [1080, 1080, 4] }[F];
const [W, H, PX] = FMT;
const st = $('#stage'); st.style.width = W + 'px'; st.style.height = H + 'px';
const land = $('#land'), ctx = land.getContext('2d'), AW = W / PX, AH = H / PX, GY = Math.round(AH * (F === 'wide' ? 0.74 : 0.75));
land.width = AW; land.height = AH; land.style.width = W + 'px'; land.style.height = H + 'px'; ctx.imageSmoothingEnabled = false;
const front = $('#front'), fctx = front.getContext('2d'); front.width = AW; front.height = AH; front.style.width = W + 'px'; front.style.height = H + 'px'; fctx.imageSmoothingEnabled = false;
const LINE = F === 'wide' ? [1, 4, 7, 25, 133, 150, 384, 6, 9, 3, 448, 94] : [1, 4, 25, 133, 7, 150, 6, 448];
const scene = Scenery.make(AW, AH, GY, { seed: 3, walkers: [], until: -20, lineup: LINE });
const ico = n => Icons.url(n);
const shot = (clip, f) => `${CLIPS}/${clip}/${String(f).padStart(4, '0')}.jpg`;
const phone = (x, y, w, rot, clip, f, z) => `<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg);z-index:${z || 1}"><div class="notch"></div><div class="scr"><img src="${shot(clip, f)}"></div></div>`;
const badge = (x, y, icon, b, s, rot) => `<div class="badge panel" style="left:${x}px;top:${y}px;transform:rotate(${rot || 0}deg);z-index:5"><img src="${ico(icon)}"><div><b>${b}</b><small>${s}</small></div></div>`;
const logo = (x, y, size, align) => `<div class="abs" style="left:${x}px;top:${y}px;width:${align === 'c' ? W : 900}px;text-align:${align === 'c' ? 'center' : 'left'};margin-left:${align === 'c' ? -x : 0}px"><img src="${ico('ball')}" style="width:${size * 0.62}px;height:${size * 0.62}px;vertical-align:${size * 0.06}px;margin-right:${size * 0.12}px"><h1 class="logo" style="display:inline-block;font-size:${size}px">Poké<span>Idle</span></h1></div>`;

let html = '', cta = '';
if (F === 'ig') {
  html += logo(0, 44, 132, 'c');
  html += `<div class="abs tagl" style="left:0;width:${W}px;top:214px;text-align:center;font-size:46px">Entrena, evoluciona y <span style="color:var(--yellow)">colecciona</span></div>`;
  html += `<div class="glow" style="left:230px;top:300px;width:620px;height:620px"></div>`;
  html += phone(200, 318, 330, -7, 'boss', 100, 2) + phone(552, 304, 330, 6, 'gacha1', 150, 3);
  html += `<div style="--bf:34px">` + badge(26, 360, 'book', '1027 Pokémon', 'De Kanto a Paldea', -3) + badge(690, 300, 'ball3', 'Gacha', '¡Legendarios!', 4) +
    badge(22, 760, 'crown', 'Jefes y Liga', 'Líderes y Alto Mando', 2) + badge(712, 838, 'egg0', 'Huevos', 'y shinies', -4) + `</div>`;
  cta = `<div class="abs" style="left:0;width:${W}px;top:1252px;text-align:center;z-index:6"><span class="btnp" style="font-size:52px">¡Juega gratis!</span> <span class="url" style="font-size:52px;margin-left:16px">pokeidle<span>game</span>.com</span></div>`;
} else if (F === 'sq') {
  html += logo(0, 36, 120, 'c');
  html += `<div class="abs tagl" style="left:0;width:${W}px;top:190px;text-align:center;font-size:42px">El juego <span style="color:var(--yellow)">idle</span> de Pokémon</div>`;
  html += `<div class="glow" style="left:250px;top:240px;width:580px;height:580px"></div>`;
  html += phone(232, 270, 290, -7, 'boss', 100, 2) + phone(548, 258, 290, 6, 'gacha1', 150, 3);
  html += `<div style="--bf:32px">` + badge(24, 330, 'book', '1027 Pokémon', 'Todas las regiones', -3) + badge(736, 690, 'ball3', 'Gacha', '¡Legendarios!', 4) + `</div>`;
  cta = `<div class="abs" style="left:0;width:${W}px;top:985px;text-align:center;z-index:6"><span class="btnp" style="font-size:44px">¡Juega gratis!</span> <span class="url" style="font-size:44px;margin-left:14px">pokeidle<span>game</span>.com</span></div>`;
} else {
  html += logo(90, 90, 150, 'l');
  html += `<div class="abs tagl" style="left:96px;top:280px;font-size:50px;line-height:1.25">Entrena, evoluciona y<br><span style="color:var(--yellow)">colecciona</span> a todos los Pokémon</div>`;
  html += `<div class="abs" style="left:96px;top:455px;display:grid;grid-template-columns:auto auto;gap:22px 22px;z-index:5">` +
    [['book', '1027 Pokémon', 'De Kanto a Paldea'], ['ball3', 'Gacha', '¡Legendarios y shinies!'], ['crown', 'Jefes y Liga', 'Líderes y Alto Mando'], ['egg0', 'Huevos', 'Crianza e incubadora']]
      .map(b => `<div class="badge panel" style="position:relative"><img src="${ico(b[0])}"><div><b>${b[1]}</b><small>${b[2]}</small></div></div>`).join('') + `</div>`;
  html += `<div class="abs" style="left:96px;top:700px;z-index:6"><span class="btnp" style="font-size:50px">¡Juega gratis!</span> <span class="url" style="font-size:50px;margin-left:16px">pokeidle<span>game</span>.com</span></div>`;
  html += `<div class="glow" style="left:1060px;top:-60px;width:820px;height:820px"></div>`;
  html += phone(1110, 70, 330, -6, 'boss', 100, 2) + phone(1450, 50, 330, 6, 'gacha1', 150, 3);
}
$('#ui').innerHTML = html; $('#ui2').innerHTML = cta;

window.ready = async () => {
  await document.fonts.ready;
  await Scenery.ready(LINE.map(d => [d, d === 6, 'idle']));
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  const n = LINE.length, ys = { ig: [0.30, 0.56], sq: [0.30, 0.52], wide: [0.40, 0.72] }[F];
  const lineup = LINE.map((d, i) => ({ d, sh: d === 6, x: AW * (0.5 + i) / n, y: GY + (AH - GY) * ys[i % 2], t: 0.4 + i * 0.37, scale: d === 150 || d === 384 ? 1.3 : 1.2 }));
  scene.draw(ctx, 7.3, { moonX: F === 'wide' ? AW * 0.55 : -200, moonY: F === 'wide' ? 34 : 30, noWalkers: true });
  lineup.sort((a, b) => a.y - b.y);
  for (const w of lineup) {
    const a = Sprites.DEX[w.d].anim, hh = (a.idle || a.walk).h, sc = w.scale * Math.min(1, 52 / hh);
    fctx.fillStyle = 'rgba(0,0,0,0.35)'; fctx.beginPath(); fctx.ellipse(Math.round(w.x), Math.round(w.y), 11 * sc, 4 * sc, 0, 0, 6.3); fctx.fill();
    Sprites.draw(fctx, w.d, w.sh, 'idle', Math.PI / 2, w.t, w.x, w.y, sc, {});
  }
  if (F !== 'wide') { const g = fctx.createLinearGradient(0, AH - 30, 0, AH); g.addColorStop(0, 'rgba(5,12,36,0)'); g.addColorStop(1, 'rgba(5,12,36,0.85)'); fctx.fillStyle = g; fctx.fillRect(0, AH - 30, AW, 30); }
  return true;
};
window.render = () => Promise.resolve(); window.DUR = 0;
</script>
</body></html>
